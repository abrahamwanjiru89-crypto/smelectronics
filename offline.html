<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SM Dynamics Electronics — Offline</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b1120">
<meta name="application-name" content="SM Dynamics Electronics">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="shop/brand logo.png">
<link rel="stylesheet" href="shop/styles.css">
</head>
<body>
<main class="section" style="min-height:100vh; display:grid; place-items:center; text-align:center; padding:2rem;">
  <div style="max-width:520px; width:100%;">
    <h1 style="font-size:clamp(2.5rem, 5vw, 4rem); margin-bottom:1rem;">You’re Offline</h1>
    <p style="font-size:1.05rem; line-height:1.8; color:rgba(255,255,255,.78); margin-bottom:1.5rem;">
      SM Dynamics Electronics is temporarily offline. Your app is still available, and core pages will load once your connection returns.
    </p>
    <p style="margin-bottom:2rem; color:rgba(255,255,255,.6);">Try again after reconnecting, or browse the cached homepage and product content when you’re back online.</p>
    <div style="display:flex; gap:.75rem; flex-wrap:wrap; justify-content:center;">
      <a class="btn primary" href="/">Open Homepage</a>
      <button class="btn ghost" id="retryBtn" type="button">Retry connection</button>
    </div>
  </div>
</main>
<script>
  document.getElementById('retryBtn')?.addEventListener('click', () => {
    if (navigator.onLine) {
      window.location.href = '/';
    } else {
      alert('Still offline. Please reconnect and try again.');
    }
  });
</script>
</body>
</html>
